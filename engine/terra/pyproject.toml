[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terra-map"
version = "0.2.0"
description = "Evidence-backed design maps, probes, routes, and agent-first CLI workflows."
requires-python = ">=3.11"
authors = [{ name = "Vinscen" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "cli", "evidence", "engineering", "planning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/benteigland11/Terra"
Repository = "https://github.com/benteigland11/Terra"
Issues = "https://github.com/benteigland11/Terra/issues"

[project.scripts]
terra = "terra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/terra", "cg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
