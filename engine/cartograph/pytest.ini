[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    python: tests for the Python engine
    javascript: tests for the JavaScript engine
    nim: tests for the Nim engine
    openscad: tests for the OpenSCAD engine
    systemverilog: tests for the SystemVerilog engine
    angular: tests for the Angular engine
    php: tests for the PHP engine
    terraform: tests for the Terraform engine
    csharp: tests for the C# engine
    slow: heavy end-to-end tests (real venv, full pip install)
