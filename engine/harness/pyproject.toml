[project]
name = "mizpah-harness"
version = "0.11.1"
description = "The focused agent session harness: bounded worker sessions, wire-view projections, concern-gated controller reviews, sandboxed shell. Forked from decisions/cg at the v10 campaign."
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["cg"]
